# Builds the client and commits the result into main, which GitHub Pages serves.
#
# Pages is configured as "Deploy from a branch", pointed at main / (root). That
# mode serves a branch's files verbatim with no build step, so the built site
# has to exist in the branch — a repository of TypeScript sources renders
# nothing. Publishing into main rather than a gh-pages branch keeps the
# repository to a single branch.
#
# The base path comes from the repository name at build time. That matters:
# renaming the repository changes the Pages URL, and a build carrying the old
# name requests its assets from a path that no longer exists — the page loads
# and stays blank. Deriving it here means a rename fixes itself on the next run.
#
# This deploys the FRONTEND ONLY. The Express/tRPC server cannot run on Pages,
# so the build sets VITE_DEMO_MODE and the app resolves every tRPC procedure
# from local fixtures (client/src/lib/demoLink.ts). It is a design preview: no
# Shopify catalog, no real checkout, no accounts.
name: Deploy static demo to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  # Needed to commit the built site back into main.
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose — package.json already pins pnpm via
      # `packageManager`, and action-setup errors out if both are specified.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_DEMO_MODE: "true"
        run: pnpm exec vite build

      - name: Assemble the published files
        run: |
          set -euo pipefail

          # VITE_ANALYTICS_* are unset here, so the tag would ship with its
          # placeholders unsubstituted and fire a broken request per page load.
          sed -i '/umami/d' dist/public/index.html

          # Pages has no rewrite rules. Serving index.html as 404.html lets
          # wouter resolve deep links such as /products/<handle> on a cold load.
          cp dist/public/index.html dist/public/404.html

          # Branch-served Pages run the output through Jekyll, which strips
          # paths beginning with an underscore.
          touch dist/public/.nojekyll

          # Asset filenames are content-hashed, so stale ones would accumulate
          # in the repository forever without clearing the directories first.
          rm -rf assets brand
          cp -a dist/public/assets dist/public/brand .
          cp dist/public/index.html dist/public/404.html dist/public/.nojekyll .

      - name: Commit into main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets brand index.html 404.html .nojekyll

          if git diff --cached --quiet; then
            echo "Built output is unchanged."
            exit 0
          fi

          # [skip ci] is what stops this push from triggering the workflow
          # again; without it each deploy would queue the next one forever.
          git commit -m "Publish site for ${GITHUB_SHA::7} [skip ci]"

          # A source push landing mid-build would otherwise reject this one.
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push attempt $attempt failed; retrying."
            sleep 5
          done
          exit 1
