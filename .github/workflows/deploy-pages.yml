# Builds the client as a static design preview and publishes it to the
# `gh-pages` branch, which GitHub Pages then serves.
#
# Pages is configured as "Deploy from a branch" for this repository, and that
# mode serves a branch's files verbatim with no build step. Pointing it at a
# source branch therefore 404s: the repository root holds TypeScript, not an
# index.html. This workflow does the building and commits only the built output
# to `gh-pages`, so the branch Pages serves contains a real site.
#
# Repository setting this expects:
#   Settings -> Pages -> Source: "Deploy from a branch"
#                        Branch: gh-pages  /  (root)
#
# This deploys the FRONTEND ONLY. The Express/tRPC server in `server/` cannot
# run on Pages, so the build sets VITE_DEMO_MODE and the app resolves every tRPC
# procedure from local fixtures (client/src/lib/demoLink.ts). It is a design
# preview, not a working storefront: no Shopify catalog, no checkout, no auth.
name: Deploy static demo to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  # Needed to push the built output to the gh-pages branch.
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose — package.json already pins pnpm via
      # `packageManager`, and action-setup errors out if both are specified.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static demo
        env:
          # Pages serves the project site from /<repo-name>/, so assets and the
          # wouter router both need that prefix.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_DEMO_MODE: "true"
        run: pnpm exec vite build

      - name: Point the favicon at a bundled asset
        # The source favicon lives behind the authenticated /manus-storage proxy,
        # which does not exist on Pages. Rewriting it here keeps the app's own
        # index.html correct for the real full-stack deployment. The replacement
        # must be base-absolute, not relative: this same file is copied to
        # 404.html and served from nested paths like /products/<handle>.
        run: |
          sed -i "s#/manus-storage/netlet-logo-transparent_3d66ed60.png#/${{ github.event.repository.name }}/brand/netlet-logo.png#" dist/public/index.html

      - name: Drop the analytics tag
        # VITE_ANALYTICS_* are unset here, so the placeholder would ship
        # unsubstituted and fire a broken request on every page load.
        run: sed -i '/umami/d' dist/public/index.html

      - name: Add SPA fallback
        # Pages has no rewrite rules. Serving index.html as 404.html lets wouter
        # resolve deep links such as /products/<handle> on a cold load.
        run: cp dist/public/index.html dist/public/404.html

      - name: Disable Jekyll
        # Branch-served Pages run the output through Jekyll, which strips paths
        # beginning with an underscore. Vite is free to emit such names, so opt
        # out rather than depend on it never doing so.
        run: touch dist/public/.nojekyll

      - name: Publish to gh-pages
        # Force-pushed as a single orphan commit: the branch is build output, so
        # its history has no value and is not worth growing the repository for.
        run: |
          cd dist/public
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Build ${{ github.sha }}"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            HEAD:gh-pages
